name: web

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks: [web]

  hschaletzky:
    image: ghcr.io/hannesschaletzky/hschaletzky:${HSCHALETZKY_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    networks: [web]
    mem_limit: 512m

  tischlerei:
    image: ghcr.io/hannesschaletzky/tischlerei-mustermann:${TISCHLEREI_TAG:-latest}
    restart: unless-stopped
    networks: [web]
    mem_limit: 128m

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
