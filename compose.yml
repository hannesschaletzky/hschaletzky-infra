name: web

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Ordner statt Datei: git pull ersetzt die Datei, ein Datei-Mount hielte die alte Version fest
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks: [web]

  hschaletzky:
    image: ghcr.io/hannesschaletzky/hschaletzky:${HSCHALETZKY_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    networks: [web]
    mem_limit: 512m

  tischlerei:
    image: ghcr.io/hannesschaletzky/tischlerei-mustermann:${TISCHLEREI_TAG:-latest}
    restart: unless-stopped
    networks: [web]
    mem_limit: 128m

  # Mängelfassung der Tischlerei für den Beispielbericht des Website-Check-ups
  tischlerei-maengel:
    image: ghcr.io/hannesschaletzky/tischlerei-mustermann:${TISCHLEREI_MAENGEL_TAG:-maengel}
    restart: unless-stopped
    networks: [web]
    mem_limit: 128m

  sv-musterstadt:
    image: ghcr.io/hannesschaletzky/sv-musterstadt:${SV_MUSTERSTADT_TAG:-latest}
    restart: unless-stopped
    networks: [web]
    mem_limit: 128m

  physio-musterfrau:
    image: ghcr.io/hannesschaletzky/physio-musterfrau:${PHYSIO_MUSTERFRAU_TAG:-latest}
    restart: unless-stopped
    networks: [web]
    mem_limit: 128m

  # Einkaufsliste (Next.js), die SQLite-Datei liegt im Volume und überlebt neue Images
  quarantine:
    image: ghcr.io/hannesschaletzky/quarantine_list:${QUARANTINE_TAG:-latest}
    restart: unless-stopped
    volumes:
      - quarantine_data:/data
    networks: [web]
    mem_limit: 256m

  # Focus Game (Next.js), Spiele und Bestenliste in SQLite im Volume
  focus:
    image: ghcr.io/hannesschaletzky/focusgame:${FOCUS_TAG:-latest}
    restart: unless-stopped
    volumes:
      - focus_data:/data
    networks: [web]
    mem_limit: 256m

  # Bewerbungs-Pipeline mit MCP-Server für claude.ai (Repo hschaletzky-pipeline).
  # Nur das App-Secret, die App-Rolle darf Daten lesen und schreiben, nichts sonst.
  hschaletzky-pipeline:
    image: ghcr.io/hannesschaletzky/hschaletzky-pipeline:${PIPELINE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://pipeline_app@postgres:5432/pipeline
      DATABASE_PASSWORD_FILE: /run/secrets/pipeline_db_app
      PUBLIC_BASE_URL: https://pipeline.hschaletzky.com
      # Tokens stellt hschaletzky-auth aus; die Pipeline prüft sie nur (Schlüssel intern abgerufen)
      AUTH_ISSUER: https://auth.hschaletzky.com
      AUTH_JWKS_URL: http://hschaletzky-auth:3000/api/auth/jwks
      # Zeitpunkt des letzten erfolgreichen Backups: /health zeigt dessen Alter fürs Monitoring
      BACKUP_STATUS_FILE: /backup-status/last-success
    secrets: [pipeline_db_app]
    volumes:
      - backup_status:/backup-status:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [web, db]
    mem_limit: 256m

  # Migrationen mit der Owner-Rolle, gleiches Image wie die App. Läuft nur über deploy.sh
  # (Profil "tools", damit "up" ihn nicht dauerhaft startet). Setzt auch das Passwort der App-Rolle.
  pipeline-migrate:
    image: ghcr.io/hannesschaletzky/hschaletzky-pipeline:${PIPELINE_TAG:-latest}
    profiles: [tools]
    command: ["node", "dist/db/migrate.js"]
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: postgres://pipeline@postgres:5432/pipeline
      MIGRATION_DATABASE_PASSWORD_FILE: /run/secrets/pipeline_db_owner
      APP_DB_PASSWORD_FILE: /run/secrets/pipeline_db_app
      BACKUP_DB_PASSWORD_FILE: /run/secrets/pipeline_db_backup
    secrets: [pipeline_db_owner, pipeline_db_app, pipeline_db_backup]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [db]

  # Nur im internen Netz "db": kein veröffentlichter Port, Caddy kommt nicht heran.
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_DB: pipeline
      # Gilt nur bei der Ersteinrichtung des Volumes. Später ändern: ALTER ROLE pipeline PASSWORD ...
      POSTGRES_PASSWORD_FILE: /run/secrets/pipeline_db_owner
    secrets: [pipeline_db_owner]
    volumes:
      # Postgres 18+ legt die Daten in einem versionierten Unterordner darunter ab
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [db]
    mem_limit: 512m

  # Login und Tokens für die MCP-Connectoren (Repo hschaletzky-auth, Better Auth). Eigene Datenbank.
  hschaletzky-auth:
    image: ghcr.io/hannesschaletzky/hschaletzky-auth:${AUTH_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      PUBLIC_BASE_URL: https://auth.hschaletzky.com
      DATABASE_URL: postgres://auth_app@auth-postgres:5432/auth
      DATABASE_PASSWORD_FILE: /run/secrets/auth_db_app
      BETTER_AUTH_SECRET_FILE: /run/secrets/auth_secret
      GITHUB_CLIENT_ID_FILE: /run/secrets/auth_github_client_id
      GITHUB_CLIENT_SECRET_FILE: /run/secrets/auth_github_client_secret
      # Numerische GitHub-IDs (ändern sich nicht, anders als Login-Namen), öffentlich abrufbar
      ALLOWED_GITHUB_USER_IDS: "29574225"
      # Dienste, für die Tokens ausgestellt werden (je Token genau einer, als aud)
      RESOURCES: https://pipeline.hschaletzky.com/mcp
    secrets: [auth_db_app, auth_secret, auth_github_client_id, auth_github_client_secret]
    depends_on:
      auth-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [web, auth-db]
    mem_limit: 256m

  # Migrationen von hschaletzky-auth mit der Owner-Rolle, wie pipeline-migrate.
  auth-migrate:
    image: ghcr.io/hannesschaletzky/hschaletzky-auth:${AUTH_TAG:-latest}
    profiles: [tools]
    command: ["node", "dist/db/migrate.js"]
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: postgres://auth@auth-postgres:5432/auth
      MIGRATION_DATABASE_PASSWORD_FILE: /run/secrets/auth_db_owner
      APP_DB_PASSWORD_FILE: /run/secrets/auth_db_app
    secrets: [auth_db_owner, auth_db_app]
    depends_on:
      auth-postgres:
        condition: service_healthy
    networks: [auth-db]

  # Datenbank von hschaletzky-auth, getrennt von der Pipeline. Nur kurzlebiger Zustand (Sitzungen,
  # Clients, Tokens, Signierschlüssel), daher bewusst ohne Backup: Bei Verlust neu anmelden.
  auth-postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth
      POSTGRES_DB: auth
      POSTGRES_PASSWORD_FILE: /run/secrets/auth_db_owner
    secrets: [auth_db_owner]
    volumes:
      - auth_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [auth-db]
    mem_limit: 256m

  # Tägliches Backup (03:00 UTC) auf die Storage Box, verschlüsselt mit age. Image wird auf
  # dem Server gebaut (backup/). Test: docker compose run --rm backup now
  backup:
    build: ./backup
    image: hschaletzky-backup:local
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: pipeline
      # Nur Leserechte, Sitzungen sind read-only (angelegt vom Migrationsschritt der Pipeline)
      PGUSER: pipeline_backup
      # Unterkonto: sieht nur backups/, nur aus dem Hetzner-Netz erreichbar (tofu/backup.tf)
      BACKUP_TARGET: u717862-sub1@u717862.your-storagebox.de
      BACKUP_HOUR_UTC: "3"
      RETENTION_DAYS: "30"
    secrets: [pipeline_db_backup, backup_ssh_key]
    volumes:
      # Nicht read-only: SQLite im WAL-Modus braucht Schreibzugriff auf die -shm-Datei
      - quarantine_data:/sources/quarantine
      - focus_data:/sources/focus
      - backup_status:/status
    # Klartext-Kopien entstehen nur im RAM
    tmpfs: [/tmp]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [db, backup]
    mem_limit: 256m

networks:
  web:
  # Intern: kein Zugang nach außen, nur App, Migration und Backup
  db:
    internal: true
  # Intern: nur hschaletzky-auth und seine Migration
  auth-db:
    internal: true
  # Nur für den Backup-Dienst: Weg nach außen zur Storage Box, ohne Zugang zu Caddy und Apps
  backup:

# Dateien liegen nur auf dem Server (gitignored), angelegt von scripts/push-secrets.sh
secrets:
  pipeline_db_owner:
    file: ./secrets/pipeline_db_owner
  pipeline_db_app:
    file: ./secrets/pipeline_db_app
  auth_db_owner:
    file: ./secrets/auth_db_owner
  auth_db_app:
    file: ./secrets/auth_db_app
  auth_secret:
    file: ./secrets/auth_secret
  auth_github_client_id:
    file: ./secrets/auth_github_client_id
  auth_github_client_secret:
    file: ./secrets/auth_github_client_secret
  pipeline_db_backup:
    file: ./secrets/pipeline_db_backup
  # Erzeugt auf dem Server von scripts/backup-ssh-key.sh, verlässt ihn nie
  backup_ssh_key:
    file: ./secrets/backup_ssh_key

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  quarantine_data:
  focus_data:
  postgres_data:
  backup_status:
  auth_postgres_data:
