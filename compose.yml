name: web

# Härtung für alle Dienste: Prozesse im Container können keine zusätzlichen Rechte erlangen
# (setuid-Programme, Datei-Capabilities).
x-gehaertet: &gehaertet
  security_opt: [no-new-privileges:true]

# Statische Seiten (Caddy mit fertigem HTML): Dateisystem nur lesbar. Caddy schreibt beim Start nur
# Verwaltungsdaten nach /data und /config, die leben im RAM.
x-statisch: &statisch
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/data, /config, /tmp]

services:
  caddy:
    <<: *gehaertet
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Ordner statt Datei: git pull ersetzt die Datei, ein Datei-Mount hielte die alte Version fest
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
      # Blog-Previews, geschrieben von deploy.sh (gitignored)
      - ./previews:/srv/previews:ro
    networks: [web]

  hschaletzky:
    <<: *gehaertet
    image: ghcr.io/hannesschaletzky/hschaletzky:${HSCHALETZKY_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    networks: [web]
    mem_limit: 512m

  # Blog (Astro, statisch). Das Repo ist privat, das Image enthält nur veröffentlichte Artikel und ist public.
  blog:
    <<: *statisch
    image: ghcr.io/hannesschaletzky/hschaletzky-blog:${BLOG_TAG:-latest}
    restart: unless-stopped
    networks: [web]
    mem_limit: 64m

  # Fraktion Bräune (privates Spaßprojekt, Astro statisch), eigene Domain fraktion-braeune.de
  fraktion-braeune:
    <<: *statisch
    image: ghcr.io/hannesschaletzky/fraktion_braeune:${FRAKTION_BRAEUNE_TAG:-latest}
    restart: unless-stopped
    networks: [web]
    mem_limit: 64m

  tischlerei:
    <<: *statisch
    image: ghcr.io/hannesschaletzky/tischlerei-mustermann:${TISCHLEREI_TAG:-latest}
    restart: unless-stopped
    networks: [web]
    mem_limit: 128m

  # Mängelfassung der Tischlerei für den Beispielbericht des Website-Check-ups
  tischlerei-maengel:
    <<: *statisch
    image: ghcr.io/hannesschaletzky/tischlerei-mustermann:${TISCHLEREI_MAENGEL_TAG:-maengel}
    restart: unless-stopped
    networks: [web]
    mem_limit: 128m

  sv-musterstadt:
    <<: *statisch
    image: ghcr.io/hannesschaletzky/sv-musterstadt:${SV_MUSTERSTADT_TAG:-latest}
    restart: unless-stopped
    networks: [web]
    mem_limit: 128m

  physio-musterfrau:
    <<: *statisch
    image: ghcr.io/hannesschaletzky/physio-musterfrau:${PHYSIO_MUSTERFRAU_TAG:-latest}
    restart: unless-stopped
    networks: [web]
    mem_limit: 128m

  # Einkaufsliste (Next.js), die SQLite-Datei liegt im Volume und überlebt neue Images
  quarantine:
    <<: *gehaertet
    image: ghcr.io/hannesschaletzky/quarantine_list:${QUARANTINE_TAG:-latest}
    restart: unless-stopped
    volumes:
      - quarantine_data:/data
    networks: [web]
    mem_limit: 256m

  # Focus Game (Next.js), Spiele und Bestenliste in SQLite im Volume
  focus:
    <<: *gehaertet
    image: ghcr.io/hannesschaletzky/focusgame:${FOCUS_TAG:-latest}
    restart: unless-stopped
    volumes:
      - focus_data:/data
    networks: [web]
    mem_limit: 256m

  # Bewerbungs-Pipeline mit MCP-Server für claude.ai (Repo hschaletzky-pipeline).
  # Nur das App-Secret, die App-Rolle darf Daten lesen und schreiben, nichts sonst.
  hschaletzky-pipeline:
    <<: *gehaertet
    image: ghcr.io/hannesschaletzky/hschaletzky-pipeline:${PIPELINE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://pipeline_app@postgres:5432/pipeline
      DATABASE_PASSWORD_FILE: /run/secrets/pipeline_db_app
      PUBLIC_BASE_URL: https://pipeline.hschaletzky.com
      # Tokens stellt hschaletzky-auth aus; die Pipeline prüft sie nur (Schlüssel intern abgerufen)
      AUTH_ISSUER: https://auth.hschaletzky.com
      AUTH_JWKS_URL: http://hschaletzky-auth:3000/api/auth/jwks
      # Zeitpunkt des letzten erfolgreichen Backups: /health zeigt dessen Alter fürs Monitoring
      BACKUP_STATUS_FILE: /backup-status/last-success
    secrets: [pipeline_db_app]
    volumes:
      - backup_status:/backup-status:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [web, db]
    mem_limit: 256m

  # Migrationen mit der Owner-Rolle, gleiches Image wie die App. Läuft nur über deploy.sh
  # (Profil "tools", damit "up" ihn nicht dauerhaft startet). Setzt auch das Passwort der App-Rolle.
  pipeline-migrate:
    <<: *gehaertet
    image: ghcr.io/hannesschaletzky/hschaletzky-pipeline:${PIPELINE_TAG:-latest}
    profiles: [tools]
    command: ["node", "dist/db/migrate.js"]
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: postgres://pipeline@postgres:5432/pipeline
      MIGRATION_DATABASE_PASSWORD_FILE: /run/secrets/pipeline_db_owner
      APP_DB_PASSWORD_FILE: /run/secrets/pipeline_db_app
      BACKUP_DB_PASSWORD_FILE: /run/secrets/pipeline_db_backup
    secrets: [pipeline_db_owner, pipeline_db_app, pipeline_db_backup]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [db]

  # Nur im internen Netz "db": kein veröffentlichter Port, Caddy kommt nicht heran.
  postgres:
    <<: *gehaertet
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_DB: pipeline
      # Gilt nur bei der Ersteinrichtung des Volumes. Später ändern: ALTER ROLE pipeline PASSWORD ...
      POSTGRES_PASSWORD_FILE: /run/secrets/pipeline_db_owner
    secrets: [pipeline_db_owner]
    volumes:
      # Postgres 18+ legt die Daten in einem versionierten Unterordner darunter ab
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [db]
    mem_limit: 512m

  # Login und Tokens für die MCP-Connectoren (Repo hschaletzky-auth, Better Auth). Eigene Datenbank.
  hschaletzky-auth:
    <<: *gehaertet
    image: ghcr.io/hannesschaletzky/hschaletzky-auth:${AUTH_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      PUBLIC_BASE_URL: https://auth.hschaletzky.com
      DATABASE_URL: postgres://auth_app@auth-postgres:5432/auth
      DATABASE_PASSWORD_FILE: /run/secrets/auth_db_app
      BETTER_AUTH_SECRET_FILE: /run/secrets/auth_secret
      GITHUB_CLIENT_ID_FILE: /run/secrets/auth_github_client_id
      GITHUB_CLIENT_SECRET_FILE: /run/secrets/auth_github_client_secret
      # Numerische GitHub-IDs (ändern sich nicht, anders als Login-Namen), öffentlich abrufbar
      ALLOWED_GITHUB_USER_IDS: "29574225"
      # Dienste, für die Tokens ausgestellt werden (je Token genau einer, als aud)
      RESOURCES: https://pipeline.hschaletzky.com/mcp
    secrets: [auth_db_app, auth_secret, auth_github_client_id, auth_github_client_secret]
    depends_on:
      auth-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [web, auth-db]
    mem_limit: 256m

  # Migrationen von hschaletzky-auth mit der Owner-Rolle, wie pipeline-migrate.
  auth-migrate:
    <<: *gehaertet
    image: ghcr.io/hannesschaletzky/hschaletzky-auth:${AUTH_TAG:-latest}
    profiles: [tools]
    command: ["node", "dist/db/migrate.js"]
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: postgres://auth@auth-postgres:5432/auth
      MIGRATION_DATABASE_PASSWORD_FILE: /run/secrets/auth_db_owner
      APP_DB_PASSWORD_FILE: /run/secrets/auth_db_app
    secrets: [auth_db_owner, auth_db_app]
    depends_on:
      auth-postgres:
        condition: service_healthy
    networks: [auth-db]

  # Datenbank von hschaletzky-auth, getrennt von der Pipeline. Nur kurzlebiger Zustand (Sitzungen,
  # Clients, Tokens, Signierschlüssel), daher bewusst ohne Backup: Bei Verlust neu anmelden.
  auth-postgres:
    <<: *gehaertet
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth
      POSTGRES_DB: auth
      POSTGRES_PASSWORD_FILE: /run/secrets/auth_db_owner
    secrets: [auth_db_owner]
    volumes:
      - auth_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [auth-db]
    mem_limit: 256m

  # Tägliches Backup (03:00 UTC) auf die Storage Box, verschlüsselt mit age. Image wird auf
  # dem Server gebaut (backup/). Test: docker compose run --rm backup now
  backup:
    <<: *gehaertet
    build: ./backup
    image: hschaletzky-backup:local
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: pipeline
      # Nur Leserechte, Sitzungen sind read-only (angelegt vom Migrationsschritt der Pipeline)
      PGUSER: pipeline_backup
      # Unterkonto: sieht nur backups/, nur aus dem Hetzner-Netz erreichbar (tofu/backup.tf)
      BACKUP_TARGET: u717862-sub1@u717862.your-storagebox.de
      BACKUP_HOUR_UTC: "3"
      RETENTION_DAYS: "30"
      # Plausible mitsichern (Konten in Postgres, Besuche in ClickHouse); leer lassen = überspringen
      PLAUSIBLE_PGHOST: plausible-db
      PLAUSIBLE_CLICKHOUSE: plausible-events
    secrets: [pipeline_db_backup, backup_ssh_key]
    volumes:
      # Nicht read-only: SQLite im WAL-Modus braucht Schreibzugriff auf die -shm-Datei
      - quarantine_data:/sources/quarantine
      - focus_data:/sources/focus
      - backup_status:/status
    # Klartext-Kopien entstehen nur im RAM
    tmpfs: [/tmp]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [db, backup, plausible]
    mem_limit: 256m

  # Besucherstatistik ohne Cookies (Plausible Community Edition) für hschaletzky.com.
  # Dashboard unter stats.hschaletzky.com, das Zählskript läuft über hschaletzky.com selbst (Caddyfile).
  # Konfiguration liest Plausible als Dateien aus /run/secrets (Dateiname = Variable).
  plausible:
    <<: *gehaertet
    image: ghcr.io/plausible/community-edition:v3.2.1
    restart: unless-stopped
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    environment:
      BASE_URL: https://stats.hschaletzky.com
      # im Container auf allen Schnittstellen lauschen, sonst erreicht Caddy ihn nicht
      LISTEN_IP: 0.0.0.0
      HTTP_PORT: "8000"
      # nur das erste Konto darf sich selbst registrieren, danach nur mit Einladung
      DISABLE_REGISTRATION: invite_only
      DATABASE_URL: postgres://postgres@plausible-db:5432/plausible
      CLICKHOUSE_DATABASE_URL: http://plausible-events:8123/plausible_events_db
      TMPDIR: /var/lib/plausible/tmp
    secrets:
      - source: plausible_secret_key_base
        target: SECRET_KEY_BASE
      - source: plausible_totp_vault_key
        target: TOTP_VAULT_KEY
    volumes:
      - plausible_data:/var/lib/plausible
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    depends_on:
      plausible-db:
        condition: service_healthy
      plausible-events:
        condition: service_healthy
    networks: [web, plausible]
    mem_limit: 512m

  # Konten und Einstellungen von Plausible. Nur im internen Netz "plausible" erreichbar,
  # deshalb ohne Passwort (wie die offizielle Vorlage).
  plausible-db:
    <<: *gehaertet
    image: postgres:16.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - plausible_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [plausible]
    mem_limit: 256m

  # Die Besuche selbst (ClickHouse), mit den Spar-Einstellungen der offiziellen Vorlage
  plausible-events:
    <<: *gehaertet
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - plausible_events_data:/var/lib/clickhouse
      - plausible_events_logs:/var/log/clickhouse-server
      - ./plausible/clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ./plausible/clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      - ./plausible/clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
      - ./plausible/clickhouse/default-profile-low-resources-overrides.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 1m
    networks: [plausible]
    mem_limit: 1g

  # Server-Monitoring (Beszel): CPU, RAM, Festplatte und Netz, auch pro Container, mit Alarmen.
  # Dashboard unter monitor.hschaletzky.com, System "hetzner-hschaletzky" über /beszel_socket/beszel.sock.
  beszel:
    <<: *gehaertet
    image: henrygd/beszel:0.21.2
    restart: unless-stopped
    environment:
      APP_URL: https://monitor.hschaletzky.com
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket
    networks: [web]
    mem_limit: 256m

  # Agent für den Hub: liest Host- und Container-Werte und spricht über eine Socket-Datei mit dem Hub
  # (kein offener Port). KEY ist der öffentliche Schlüssel des Hubs, nicht geheim.
  beszel-agent:
    <<: *gehaertet
    image: henrygd/beszel-agent:0.21.2
    restart: unless-stopped
    network_mode: host
    environment:
      LISTEN: /beszel_socket/beszel.sock
      KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPhGEbR7oHZz9CMTMhEw/syD19Ykkg5a1r6muhbp56il"
    volumes:
      - beszel_socket:/beszel_socket
      - beszel_agent_data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m

networks:
  web:
  # Intern: kein Zugang nach außen, nur App, Migration und Backup
  db:
    internal: true
  # Intern: nur hschaletzky-auth und seine Migration
  auth-db:
    internal: true
  # Intern: nur Plausible und seine beiden Datenbanken
  plausible:
    internal: true
  # Nur für den Backup-Dienst: Weg nach außen zur Storage Box, ohne Zugang zu Caddy und Apps
  backup:

# Dateien liegen nur auf dem Server (gitignored), angelegt von scripts/push-secrets.sh
secrets:
  pipeline_db_owner:
    file: ./secrets/pipeline_db_owner
  pipeline_db_app:
    file: ./secrets/pipeline_db_app
  auth_db_owner:
    file: ./secrets/auth_db_owner
  auth_db_app:
    file: ./secrets/auth_db_app
  auth_secret:
    file: ./secrets/auth_secret
  auth_github_client_id:
    file: ./secrets/auth_github_client_id
  auth_github_client_secret:
    file: ./secrets/auth_github_client_secret
  pipeline_db_backup:
    file: ./secrets/pipeline_db_backup
  plausible_secret_key_base:
    file: ./secrets/plausible_secret_key_base
  plausible_totp_vault_key:
    file: ./secrets/plausible_totp_vault_key
  # Erzeugt auf dem Server von scripts/backup-ssh-key.sh, verlässt ihn nie
  backup_ssh_key:
    file: ./secrets/backup_ssh_key

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  quarantine_data:
  focus_data:
  postgres_data:
  backup_status:
  auth_postgres_data:
  plausible_data:
  plausible_db_data:
  plausible_events_data:
  plausible_events_logs:
  beszel_data:
  beszel_socket:
  beszel_agent_data:
