#cloud-config
# Einmalige Einrichtung beim Erstellen des Servers (Ubuntu 24.04). Template, wird von server.tf befüllt.

package_update: true
package_upgrade: true
packages: [ca-certificates, curl, git, fail2ban, unattended-upgrades]

ssh_pwauth: false
disable_root: true

users:
  - name: ${admin_user}
    shell: /bin/bash
    groups: [sudo]
    sudo: 'ALL=(ALL) NOPASSWD:ALL'
    lock_passwd: true
    ssh_authorized_keys:
      - '${admin_key}'
  - name: deploy
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      # Der Deploy-Schlüssel darf ausschließlich deploy.sh ausführen, keine Shell, kein Port-Forwarding.
      - 'command="/opt/infra/scripts/deploy.sh",restrict ${deploy_key}'

write_files:
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
      MaxAuthTries 3
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/apt/apt.conf.d/52unattended-upgrades-local
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";
  - path: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      bantime = 1h
  - path: /etc/docker/daemon.json
    content: |
      { "log-driver": "local", "log-opts": { "max-size": "10m", "max-file": "3" } }

runcmd:
  # Docker aus dem offiziellen Repository
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - . /etc/os-release && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update -q
  - DEBIAN_FRONTEND=noninteractive apt-get install -yq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ${admin_user}
  - usermod -aG docker deploy
  # Dieses Repo als Arbeitsverzeichnis für Compose und deploy.sh
  - git clone https://github.com/hannesschaletzky/hschaletzky-infra.git /opt/infra
  - chown -R deploy:deploy /opt/infra
  - git config --system --add safe.directory /opt/infra
  - systemctl enable --now fail2ban
  - systemctl reload ssh
  # Erster Start. Fehlt ein Image noch, holt der nächste Deploy das nach.
  - cd /opt/infra && sudo -u deploy docker compose up -d caddy tischlerei || true
